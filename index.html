<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>低Na血症 鑑別ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1a365d;
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Input card */
    .input-card {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .input-card h2 {
      font-size: 1rem;
      color: #2d3748;
      margin-bottom: 16px;
      border-left: 4px solid #4299e1;
      padding-left: 10px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 0.8rem;
      color: #4a5568;
      font-weight: 600;
    }

    .field .unit {
      font-size: 0.72rem;
      color: #a0aec0;
      font-weight: normal;
    }

    .field input, .field select {
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      color: #2d3748;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus, .field select:focus {
      border-color: #4299e1;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-primary {
      flex: 1;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: #2b6cb0; }

    .btn-reset {
      background: #edf2f7;
      color: #4a5568;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset:hover { background: #e2e8f0; }

    /* Result */
    #result { display: none; }

    .step {
      background: white;
      border-radius: 12px;
      padding: 18px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 14px;
      border-left: 5px solid #cbd5e0;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step.blue  { border-left-color: #4299e1; }
    .step.green { border-left-color: #48bb78; }
    .step.orange{ border-left-color: #ed8936; }
    .step.red   { border-left-color: #fc8181; }
    .step.purple{ border-left-color: #9f7aea; }

    .step-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a0aec0;
      margin-bottom: 4px;
    }

    .step-title {
      font-size: 1rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .step-body {
      font-size: 0.88rem;
      color: #4a5568;
      line-height: 1.6;
    }

    /* Diagnosis card */
    .diagnosis-card {
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 14px;
      animation: fadeIn 0.4s ease;
    }

    .diagnosis-card.result-box {
      background: linear-gradient(135deg, #ebf8ff 0%, #e6fffa 100%);
      border: 2px solid #4299e1;
    }

    .diagnosis-card h3 {
      font-size: 1.05rem;
      color: #1a365d;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: #bee3f8;
      color: #2b6cb0;
    }

    .dx-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dx-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      color: #2d3748;
    }

    .dx-list li .icon {
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .dx-list li .dx-name {
      font-weight: 700;
    }

    .dx-list li .dx-detail {
      color: #718096;
      font-size: 0.82rem;
    }

    /* Osm calc */
    .calc-note {
      background: #fffaf0;
      border: 1px solid #fbd38d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #744210;
      margin-top: 6px;
    }

    .calc-note strong { font-weight: 700; }

    .warning-box {
      background: #fff5f5;
      border: 1px solid #fc8181;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #742a2a;
      margin-top: 8px;
    }

    .info-box {
      background: #ebf8ff;
      border: 1px solid #90cdf4;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #2a4365;
      margin-top: 8px;
    }

    hr.divider {
      border: none;
      border-top: 1px dashed #e2e8f0;
      margin: 12px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-right: 4px;
    }

    .badge.hypo { background: #bee3f8; color: #2b6cb0; }
    .badge.eu   { background: #c6f6d5; color: #276749; }
    .badge.hyper{ background: #fed7d7; color: #9b2c2c; }

    /* Tracking */
    .tracking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .tracking-row:last-child { border-bottom: none; }

    .tracking-table-wrap { overflow-x: auto; }

    .tracking-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-top: 4px;
    }
    .tracking-table th {
      background: #f7fafc;
      color: #4a5568;
      font-weight: 700;
      padding: 7px 10px;
      text-align: left;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }
    .tracking-table td {
      padding: 7px 10px;
      border-bottom: 1px solid #f0f4f8;
      color: #2d3748;
      vertical-align: top;
    }
    .tracking-table tr:last-child td { border-bottom: none; }

    .rate-ok { color: #276749; }
    .rate-warn { color: #744210; }
    .rate-danger { color: #9b2c2c; font-weight: 700; }

    /* Treatment calc */
    .treat-calc {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #2d3748;
      margin-top: 8px;
      line-height: 1.8;
    }
    .treat-calc strong { color: #1a365d; }

    /* Responsive */
    @media (max-width: 500px) {
      .input-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>低Na血症 鑑別ツール</h1>
  <p class="subtitle">血清Na &lt; 135 mEq/L の系統的鑑別</p>

  <div class="input-card">
    <h2>検査値入力</h2>
    <div class="input-grid">
      <div class="field">
        <label>血清Na <span class="unit">mEq/L</span></label>
        <input type="number" id="serum_na" placeholder="例: 128" step="1" oninput="calcFENa(); calcCorrectedNa();">
      </div>
      <div class="field">
        <label>血清浸透圧 <span class="unit">mOsm/kg（任意）</span></label>
        <input type="number" id="serum_osm" placeholder="例: 265" step="1">
      </div>
      <div class="field">
        <label>血糖 <span class="unit">mg/dL（任意）</span></label>
        <input type="number" id="glucose" placeholder="例: 180" step="1" oninput="calcCorrectedNa()">
      </div>
      <div class="field">
        <label>BUN <span class="unit">mg/dL（任意）</span></label>
        <input type="number" id="bun" placeholder="例: 15" step="1">
      </div>
      <div class="field">
        <label>尿浸透圧 <span class="unit">mOsm/kg</span></label>
        <input type="number" id="urine_osm" placeholder="例: 450" step="1" oninput="syncSgFromOsm()">
      </div>
      <div class="field">
        <label>尿比重 <span class="unit">（浸透圧の代替）</span></label>
        <input type="number" id="urine_sg" placeholder="例: 1.015" step="0.001" min="1.000" max="1.040" oninput="syncOsmFromSg()">
      </div>
      <div class="field">
        <label>尿中Na <span class="unit">mEq/L</span></label>
        <input type="number" id="urine_na" placeholder="例: 40" step="1" oninput="calcFENa()">
      </div>
      <div class="field">
        <label>IVC径 <span class="unit">cm（任意）</span></label>
        <input type="number" id="ivc_diam" placeholder="例: 1.8" step="0.1" min="0" max="5" oninput="suggestVolume()">
      </div>
      <div class="field">
        <label>IVC虚脱率 <span class="unit">%（任意）</span></label>
        <input type="number" id="ivc_col" placeholder="例: 60" step="1" min="0" max="100" oninput="suggestVolume()">
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label>体液量評価</label>
        <select id="volume">
          <option value="">-- 選択 --</option>
          <option value="hypo">低下（皮膚ツルゴール低下、口渇、頻脈など）</option>
          <option value="eu">正常</option>
          <option value="hyper">増加（浮腫、腹水、肺うっ血など）</option>
        </select>
        <div id="ivc_hint" style="margin-top:6px;"></div>
      </div>
      <div class="field">
        <label>血清K <span class="unit">mEq/L（任意）</span></label>
        <input type="number" id="serum_k" placeholder="例: 4.0" step="0.1">
      </div>
      <div class="field">
        <label>血清クレアチニン <span class="unit">mg/dL（任意）</span></label>
        <input type="number" id="serum_cr" placeholder="例: 0.8" step="0.01" oninput="calcFENa()">
      </div>
      <div class="field">
        <label>尿クレアチニン <span class="unit">mg/dL（任意）</span></label>
        <input type="number" id="urine_cr" placeholder="例: 80" step="1" oninput="calcFENa()">
      </div>
      <div class="field">
        <label>尿酸 <span class="unit">mg/dL（任意）</span></label>
        <input type="number" id="uric_acid" placeholder="例: 3.2" step="0.1">
      </div>
      <div class="field">
        <label>体重 <span class="unit">kg（任意）</span></label>
        <input type="number" id="weight" placeholder="例: 60" step="0.5" min="30" max="200">
      </div>
      <div class="field">
        <label>性別</label>
        <select id="sex">
          <option value="">-- 選択 --</option>
          <option value="male">男性</option>
          <option value="female">女性</option>
          <option value="elderly">高齢者・るいそう</option>
        </select>
      </div>
      <div class="field" id="fena_display" style="display:none;">
        <label>FENa <span class="unit">自動計算</span></label>
        <div id="fena_result" style="border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:0.9rem;background:#f7fafc;color:#2d3748;"></div>
      </div>
      <div class="field" id="corrna_display" style="display:none;">
        <label>補正Na <span class="unit">高血糖補正・自動計算</span></label>
        <div id="corrna_result" style="border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:0.9rem;background:#f7fafc;color:#2d3748;"></div>
      </div>
    </div>

    <div style="border-top: 1.5px dashed #e2e8f0; margin: 18px 0 14px; position: relative;">
      <span style="position:absolute;top:-10px;left:12px;background:white;padding:0 8px;font-size:0.75rem;color:#a0aec0;font-weight:700;">臨床評価</span>
    </div>
    <div class="input-grid">
      <div class="field">
        <label>発症速度</label>
        <select id="onset">
          <option value="">-- 選択 --</option>
          <option value="acute">急性（&lt; 48時間）</option>
          <option value="chronic">慢性（≥ 48時間）</option>
          <option value="unknown">不明</option>
        </select>
      </div>
      <div class="field">
        <label>症状</label>
        <select id="symptoms">
          <option value="">-- 選択 --</option>
          <option value="none">無症状</option>
          <option value="mild">軽症（頭痛・嘔気・倦怠感）</option>
          <option value="severe">重症（痙攣・意識障害・呼吸停止）</option>
        </select>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="analyze()">鑑別を実行</button>
      <button class="btn-reset" onclick="resetAll()">リセット</button>
    </div>
  </div>

  <div class="input-card">
    <h2>⏱ 経時的Na追跡</h2>
    <p style="font-size:0.82rem;color:#718096;margin-bottom:14px;">複数時点のNaを入力し、補正速度を監視します。24時間換算速度が上限を超えると警告します。</p>
    <div id="tracking-rows">
      <div class="tracking-row" data-idx="0">
        <span style="font-size:0.8rem;color:#4a5568;font-weight:600;min-width:80px;">開始（t=0h）</span>
        <div style="display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;">
          <input type="number" class="track-na" placeholder="Na (mEq/L)" step="1" min="100" max="145" oninput="updateTracking()" style="border:1.5px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:0.88rem;width:140px;outline:none;">
          <span style="font-size:0.8rem;color:#a0aec0;">mEq/L</span>
        </div>
      </div>
    </div>
    <button class="btn-reset" onclick="addTrackingRow()" style="margin-top:12px;">＋ 測定値を追加</button>
    <div id="tracking-result" style="margin-top:14px;"></div>
  </div>

  <div id="result"></div>
</div>

<script>
function val(id) {
  const v = document.getElementById(id).value;
  return v === '' ? null : parseFloat(v);
}

function sgToOsm(sg) {
  return Math.round((sg - 1.000) * 35000);
}

function suggestVolume() {
  const d = parseFloat(document.getElementById('ivc_diam').value);
  const c = parseFloat(document.getElementById('ivc_col').value);
  const hint = document.getElementById('ivc_hint');
  const sel = document.getElementById('volume');

  if (isNaN(d) && isNaN(c)) { hint.innerHTML = ''; return; }

  let label, color, suggested, detail;

  // 両方入力あり
  if (!isNaN(d) && !isNaN(c)) {
    if (d < 2.1 && c >= 50) {
      label = '低下示唆'; color = '#2b6cb0'; suggested = 'hypo';
      detail = `IVC細小（${d} cm）＋虚脱率高（${c}%）→ 低体液量`;
    } else if (d >= 2.1 && c < 50) {
      label = '増加示唆'; color = '#9b2c2c'; suggested = 'hyper';
      detail = `IVC拡張（${d} cm）＋虚脱率低（${c}%）→ 高体液量・右心圧上昇`;
    } else if (d < 2.1 && c < 50) {
      label = '正常〜軽度増加'; color = '#276749'; suggested = 'eu';
      detail = `IVC細小（${d} cm）＋虚脱率低（${c}%）→ 正常〜境界域`;
    } else {
      label = '正常〜軽度低下'; color = '#276749'; suggested = 'eu';
      detail = `IVC正常（${d} cm）＋虚脱率高（${c}%）→ 正常〜軽度低下`;
    }
  } else if (!isNaN(d)) {
    if (d < 1.5)      { label = '低下示唆'; color = '#2b6cb0'; suggested = 'hypo'; detail = `IVC < 1.5 cm → 低体液量の可能性`; }
    else if (d > 2.1) { label = '増加示唆'; color = '#9b2c2c'; suggested = 'hyper'; detail = `IVC > 2.1 cm → 高体液量・右心圧上昇の可能性`; }
    else              { label = '正常域'; color = '#276749'; suggested = 'eu'; detail = `IVC ${d} cm → 正常範囲`; }
  } else {
    if (c >= 50)      { label = '低下示唆'; color = '#2b6cb0'; suggested = 'hypo'; detail = `虚脱率 ≥ 50% → 低体液量の可能性`; }
    else              { label = '増加〜正常'; color = '#744210'; suggested = ''; detail = `虚脱率 < 50% → IVC径も確認を`; }
  }

  hint.innerHTML = `<div style="background:#f7fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px 12px;font-size:0.8rem;">
    🔬 <strong style="color:${color}">エコー所見: ${label}</strong> — ${detail}<br>
    <span style="color:#718096;font-size:0.75rem;">※ 体液量評価の参考値。臨床所見と合わせて判断してください。</span>
  </div>`;

  if (suggested && !sel.value) sel.value = suggested;
}

function syncOsmFromSg() {
  const sg = parseFloat(document.getElementById('urine_sg').value);
  const osmEl = document.getElementById('urine_osm');
  if (!isNaN(sg) && sg >= 1.000 && sg <= 1.040) {
    osmEl.value = sgToOsm(sg);
    osmEl.style.background = '#fffaf0';
  }
}

function syncSgFromOsm() {
  document.getElementById('urine_osm').style.background = '';
}

function calcFENa() {
  const na = parseFloat(document.getElementById('serum_na').value);
  const una = parseFloat(document.getElementById('urine_na').value);
  const scr = parseFloat(document.getElementById('serum_cr').value);
  const ucr = parseFloat(document.getElementById('urine_cr').value);
  const display = document.getElementById('fena_display');
  const result = document.getElementById('fena_result');

  if (!isNaN(na) && !isNaN(una) && !isNaN(scr) && !isNaN(ucr) && na > 0 && ucr > 0) {
    const fena = (una * scr) / (na * ucr) * 100;
    let label, color;
    if (fena < 1)      { label = '< 1% → 腎前性（低体液量示唆）'; color = '#2b6cb0'; }
    else if (fena < 2) { label = '1〜2% → 境界域'; color = '#744210'; }
    else               { label = '> 2% → 腎性 / SIADH'; color = '#276749'; }
    result.innerHTML = `<strong style="color:${color}">${fena.toFixed(2)}%</strong> — ${label}`;
    display.style.display = 'flex';
    display.style.flexDirection = 'column';
    display.style.gap = '5px';
  } else {
    display.style.display = 'none';
  }
}

function resetAll() {
  ['serum_na','serum_osm','glucose','bun','urine_osm','urine_sg','urine_na','ivc_diam','ivc_col','serum_k','serum_cr','urine_cr','uric_acid','weight'].forEach(id => {
    document.getElementById(id).value = '';
  });
  ['onset','symptoms','volume','sex'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('urine_osm').style.background = '';
  document.getElementById('ivc_hint').innerHTML = '';
  document.getElementById('fena_display').style.display = 'none';
  document.getElementById('corrna_display').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('result').innerHTML = '';
  // 追跡リセット
  const trackingRows = document.getElementById('tracking-rows');
  trackingRows.innerHTML = `<div class="tracking-row" data-idx="0">
    <span style="font-size:0.8rem;color:#4a5568;font-weight:600;min-width:80px;">開始（t=0h）</span>
    <div style="display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;">
      <input type="number" class="track-na" placeholder="Na (mEq/L)" step="1" min="100" max="145" oninput="updateTracking()" style="border:1.5px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:0.88rem;width:140px;outline:none;">
      <span style="font-size:0.8rem;color:#a0aec0;">mEq/L</span>
    </div>
  </div>`;
  document.getElementById('tracking-result').innerHTML = '';
  trackRowCount = 1;
}

function calcOsm(na, glucose, bun) {
  // 2×Na + glucose/18 + BUN/2.8
  if (na === null) return null;
  const g = glucose !== null ? glucose / 18 : 5; // default ~90mg/dL → 5
  const b = bun !== null ? bun / 2.8 : 5;        // default ~14mg/dL → 5
  return Math.round(2 * na + g + b);
}

function step(color, label, title, body) {
  return `<div class="step ${color}">
    <div class="step-label">${label}</div>
    <div class="step-title">${title}</div>
    <div class="step-body">${body}</div>
  </div>`;
}

function dxBox(title, tag, items, extra='') {
  const listItems = items.map(([icon, name, detail]) =>
    `<li><span class="icon">${icon}</span><span><span class="dx-name">${name}</span><br><span class="dx-detail">${detail}</span></span></li>`
  ).join('');
  return `<div class="diagnosis-card result-box">
    <h3>🔍 考えられる鑑別診断 <span class="tag">${tag}</span></h3>
    <ul class="dx-list">${listItems}</ul>
    ${extra}
  </div>`;
}

function analyze() {
  const na = val('serum_na');
  const glucose = val('glucose');
  const bun = val('bun');
  const k = val('serum_k');
  let serum_osm = val('serum_osm');
  let urine_osm = val('urine_osm');
  let urine_osm_source = '実測値';
  if (urine_osm === null) {
    const sg = val('urine_sg');
    if (sg !== null && sg >= 1.000 && sg <= 1.040) {
      urine_osm = sgToOsm(sg);
      urine_osm_source = `比重 ${sg.toFixed(3)} より推定`;
    }
  }
  const urine_na = val('urine_na');
  const serum_cr = val('serum_cr');
  const urine_cr = val('urine_cr');
  const uric_acid = val('uric_acid');
  const fena = (na !== null && urine_na !== null && serum_cr !== null && urine_cr !== null && urine_cr > 0)
    ? (urine_na * serum_cr) / (na * urine_cr) * 100
    : null;
  const volume = document.getElementById('volume').value;
  const onset = document.getElementById('onset').value;
  const symptoms = document.getElementById('symptoms').value;

  const out = [];

  // ─── 前提確認 ───
  if (na === null) {
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').innerHTML = `<div class="step red"><div class="step-title">⚠️ 血清Naを入力してください</div></div>`;
    return;
  }

  if (na >= 135) {
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').innerHTML = step('green','確認','血清Na正常範囲','入力値 Na = ' + na + ' mEq/L は135以上のため、低Na血症ではありません。');
    return;
  }

  const severityLabel = na < 120 ? '⚠️ <strong>重症（< 120）</strong>' : na < 125 ? '中等症（120〜124）' : na < 130 ? '軽〜中等症（125〜129）' : '軽症（130〜134）';
  const onsetLabel = onset === 'acute' ? '🕐 <strong>急性（&lt; 48時間）</strong>' : onset === 'chronic' ? '慢性（≥ 48時間）' : onset === 'unknown' ? '不明' : '未入力';
  const symptomsLabel = symptoms === 'severe' ? '🚨 <strong>重症症状あり（痙攣・意識障害）</strong>' : symptoms === 'mild' ? '軽症症状あり（頭痛・嘔気）' : symptoms === 'none' ? '無症状' : '未入力';

  out.push(step('red','STEP 0','低Na血症を確認',
    `血清Na = <strong>${na} mEq/L</strong>（基準値 135〜145 mEq/L）<br>
     重症度: ${severityLabel}<br>
     発症速度: ${onsetLabel}<br>
     症状: ${symptomsLabel}`
  ));

  // ─── STEP 1: 血清浸透圧 ───
  let calcedOsm = null;
  let osmNote = '';

  if (serum_osm === null) {
    calcedOsm = calcOsm(na, glucose, bun);
    osmNote = `<div class="calc-note">血清浸透圧の入力がないため計算値を使用: <strong>${calcedOsm} mOsm/kg</strong><br>式: 2×Na + 血糖/18 + BUN/2.8${glucose===null?' （血糖はデフォルト 90 mg/dL を使用）':''}${bun===null?' （BUNはデフォルト 14 mg/dL を使用）':''}</div>`;
    serum_osm = calcedOsm;
  }

  let osmCategory, osmBody;
  if (serum_osm > 295) {
    osmCategory = 'hyper';
    osmBody = `血清浸透圧 = <strong>${serum_osm} mOsm/kg（高張性 > 295）</strong><br>高血糖や浸透圧活性物質（マンニトール、造影剤など）による希釈性低Na血症を考慮。${osmNote}`;
  } else if (serum_osm >= 280) {
    osmCategory = 'iso';
    osmBody = `血清浸透圧 = <strong>${serum_osm} mOsm/kg（等張性 280〜295）</strong><br>偽性低Na血症（脂質異常症、高タンパク血症）を考慮。${osmNote}`;
  } else {
    osmCategory = 'hypo';
    osmBody = `血清浸透圧 = <strong>${serum_osm} mOsm/kg（低張性 &lt; 280）</strong> → 真の低Na血症として鑑別を進める。${osmNote}`;
  }

  out.push(step('blue','STEP 1','血清浸透圧を評価', osmBody));

  // 高張性
  if (osmCategory === 'hyper') {
    const glucoseCorr = glucose !== null ? ` 補正Na = Na + 1.6 × (血糖 - 100)/100 = <strong>${(na + 1.6*(glucose-100)/100).toFixed(1)} mEq/L</strong>` : '';
    out.push(dxBox('高張性低Na血症', '高浸透圧', [
      ['🩸','高血糖（糖尿病性高浸透圧状態）','血糖100mg/dL上昇ごとにNaは約1.6 mEq/L低下。' + glucoseCorr],
      ['💉','高張液投与（マンニトール・造影剤）','投与歴を確認'],
      ['🧪','その他（スクロース・グリセリンなど）','まれ'],
    ]));
    render(out); return;
  }

  // 等張性（偽性）
  if (osmCategory === 'iso') {
    out.push(dxBox('等張性低Na血症（偽性低Na血症）', '等浸透圧', [
      ['🧈','高脂血症（重篤な高トリグリセリド血症）','脂肪層が水相を希釈'],
      ['🧬','高タンパク血症（多発性骨髄腫など）','タンパク質が水相を希釈'],
    ], '<div class="info-box">※ 炎症吸光法（直接法）の血ガス分析では偽性低Na血症は生じない。</div>'));
    render(out); return;
  }

  // ─── STEP 2: 低張性 → 尿浸透圧 ───
  if (urine_osm === null) {
    out.push(step('orange','STEP 2','尿浸透圧を確認（未入力）',
      '尿浸透圧または尿比重を入力してください。<br>・尿浸透圧 <strong>&lt; 100 mOsm/kg</strong>（比重 &lt; 1.003）：水利尿（多飲、低溶質摂取）<br>・尿浸透圧 <strong>≥ 100 mOsm/kg</strong>（比重 ≥ 1.003）：ADH作用あり → 体液量評価へ'));
    render(out); return;
  }

  const sgEstNote = urine_osm_source !== '実測値'
    ? `<div class="calc-note">尿浸透圧は${urine_osm_source}（換算式: (比重 − 1.000) × 35,000）。精度は±20%程度。可能であれば実測値で確認を。</div>`
    : '';

  let uosmBody = `尿浸透圧 = <strong>${urine_osm} mOsm/kg</strong>（${urine_osm_source}）`;
  if (urine_osm < 100) {
    out.push(step('blue','STEP 2','尿浸透圧 < 100 mOsm/kg → 水利尿', uosmBody + '<br>ADH 抑制された状態。腎の水排泄は正常。' + sgEstNote));
    out.push(dxBox('水利尿系疾患', '低浸透圧尿', [
      ['💧','心因性多飲（Primary Polydipsia）','精神疾患・抗精神病薬歴。水分過剰摂取で尿が薄い。'],
      ['🍺','ビールポトマニア / 低溶質摂取','アルコール多飲・絶食。溶質負荷低下により自由水排泄が追いつかない。'],
      ['🏃','激しい運動後多飲','マラソンランナーなど。'],
    ]));
  } else {
    out.push(step('blue','STEP 2','尿浸透圧 ≥ 100 mOsm/kg → ADH 作用あり', uosmBody + '<br>ADH 依存性の水貯留。体液量評価へ進む。' + sgEstNote));

    // ─── STEP 3: 体液量 ───
    if (!volume) {
      out.push(step('orange','STEP 3','体液量評価（未選択）',
        '以下の所見から評価してください。<br><br>【低下の所見】皮膚ツルゴール低下、粘膜乾燥、口渇、頻脈、起立性低血圧、前負荷圧低下<br>【増加の所見】浮腫、腹水、頸静脈怒張、肺うっ血<br>【正常】上記なし'));
      render(out); return;
    }

    const volLabel = volume === 'hypo' ? '<span class="badge hypo">体液量 低下</span>' :
                     volume === 'eu'   ? '<span class="badge eu">体液量 正常</span>' :
                                         '<span class="badge hyper">体液量 増加</span>';

    let volBody = `${volLabel}`;

    if (volume === 'hypo') {
      out.push(step('blue','STEP 3','体液量: 低下', volBody + '<br>循環血液量不足によりADHが非浸透圧性に分泌。尿中Naで原因を分類。'));

      if (urine_na === null) {
        out.push(step('orange','STEP 4','尿中Na（未入力）',
          '・尿中Na <strong>&lt; 20 mEq/L</strong>：腎外喪失（嘔吐・下痢・発汗など）<br>・尿中Na <strong>≥ 20 mEq/L</strong>：腎性喪失（利尿薬・副腎不全など）'));
        render(out); return;
      }

      const fenaNote = fena !== null
        ? `<div class="calc-note">FENa = <strong>${fena.toFixed(2)}%</strong> ${
            fena < 1 ? '→ &lt; 1%：腎前性（腎外喪失）を支持' :
            fena < 2 ? '→ 1〜2%：境界域。利尿薬使用中は解釈に注意' :
                       '→ &gt; 2%：腎性喪失 or 利尿薬の影響を示唆'
          }<br><span style="font-size:0.75rem;color:#a0aec0">※ 利尿薬使用中はFENaの信頼性が低下。FEUreaの併用を検討。</span></div>`
        : '';

      if (urine_na < 20) {
        out.push(step('green','STEP 4','尿中Na < 20 mEq/L → 腎外喪失',`尿中Na = ${urine_na} mEq/L`));
        out.push(dxBox('低体液量性低Na血症（腎外喪失）', '腎外性', [
          ['🤮','嘔吐・下痢','消化管からのNa喪失。代謝性アルカローシス（嘔吐）や酸性（下痢）を伴うことが多い。'],
          ['🌡️','発汗・熱傷','皮膚からの大量喪失。スポーツ・高体温。'],
          ['🫀','サードスペース形成','腸閉塞・膵炎・腹膜炎など。'],
        ], fenaNote));
      } else {
        out.push(step('green','STEP 4','尿中Na ≥ 20 mEq/L → 腎性喪失',`尿中Na = ${urine_na} mEq/L`));
        const kNote = k !== null && k < 3.5 ? '<div class="info-box">⚠️ 低K血症（K = ' + k + ' mEq/L）あり → 利尿薬や嘔吐（代謝性アルカローシス＋腎性Na喪失）を支持。</div>' : '';
        out.push(dxBox('低体液量性低Na血症（腎性喪失）', '腎性', [
          ['💊','利尿薬（特にサイアザイド系）','チアジドは遠位尿細管の希釈機能を障害。低K血症を伴うことが多い。'],
          ['🫘','塩類喪失性腎症','慢性腎疾患・間質性腎炎。尿中Naが高い。'],
          ['🧠','塩類喪失症候群（CSWS）','頭蓋内疾患後。SIADHと異なり低体液量性。'],
          ['🦠','副腎不全（一次性）','低Na + 高K + 低血圧。コルチゾール・アルドステロン低下。'],
        ], kNote + fenaNote));
      }

    } else if (volume === 'eu') {
      out.push(step('blue','STEP 3','体液量: 正常（等体液量性）', volBody + '<br>浮腫なし・脱水なし。ADHが不適切に分泌または抗利尿ホルモン様作用が持続。'));

      const kNote = k !== null && k > 5.5 ? '<div class="warning-box">⚠️ 高K血症（K = ' + k + ' mEq/L）あり → 副腎不全（低コルチゾール血症）を強く示唆。</div>' : '';
      const uaNote = uric_acid !== null
        ? uric_acid < 4
          ? `<div class="info-box">🧪 尿酸 = <strong>${uric_acid} mg/dL（低値）</strong> → SIADHを支持。腎尿酸クリアランス増加による低尿酸血症はSIADHの特徴。</div>`
          : `<div class="calc-note">🧪 尿酸 = <strong>${uric_acid} mg/dL（正常〜高値）</strong> → SIADHより甲状腺機能低下症・副腎不全・リセットオスモスタットの可能性。</div>`
        : '';
      const fenaEuNote = fena !== null
        ? `<div class="calc-note">FENa = <strong>${fena.toFixed(2)}%</strong>${fena >= 1 ? ' → ≥ 1%：SIADH（尿中Naが高い状態）と整合。' : ' → &lt; 1%：低体液量の可能性を再評価。'}</div>`
        : '';

      out.push(dxBox('等体液量性低Na血症', '等体液量', [
        ['🔑','SIADH（抗利尿ホルモン不適合分泌症候群）',
          '最多原因。肺疾患（肺炎・結核・SCLC）、CNS疾患、薬剤（SSRI・カルバマゼピン・シクロホスファミド）、手術後、HIV。' +
          '診断: 尿浸透圧 > 血清浸透圧、尿中Na > 40、体液量正常、甲状腺・副腎機能正常。'],
        ['🦋','甲状腺機能低下症','TFT確認。粘液水腫性昏睡では致命的。GFR低下と心拍出量低下が関与。'],
        ['🧠','糖質コルチコイド欠乏（二次性副腎不全）','CRH-ACTH-コルチゾール軸の障害。アルドステロンは正常 → 高K血症なし。'],
        ['💧','多飲（一次性多飲）','尿浸透圧 < 100 なら水利尿。100以上なら中等度多飲 + 軽度ADH分泌。'],
      ], kNote + uaNote + fenaEuNote + `
        <hr class="divider">
        <div class="info-box">
          <strong>SIADH 診断基準（Schwartz-Bartter）</strong><br>
          ① 低張性低Na血症<br>
          ② 尿浸透圧 > 100 mOsm/kg（通常 > 血清浸透圧）<br>
          ③ 尿中Na > 20〜40 mEq/L（食塩摂取が十分な場合）<br>
          ④ 臨床的に体液量正常<br>
          ⑤ 副腎・甲状腺機能正常、利尿薬未使用、腎機能正常
        </div>`
      ));

    } else { // hyper
      out.push(step('blue','STEP 3','体液量: 増加（高体液量性）', volBody + '<br>全身性浮腫疾患。有効循環血液量の低下によりADH分泌。尿中Naで原因を分類。'));

      if (urine_na === null) {
        out.push(step('orange','STEP 4','尿中Na（未入力）',
          '・尿中Na <strong>&lt; 20 mEq/L</strong>：心不全 / 肝硬変 / ネフローゼ症候群<br>・尿中Na <strong>≥ 20 mEq/L</strong>：腎不全'));
        render(out); return;
      }

      if (urine_na < 20) {
        out.push(step('green','STEP 4','尿中Na < 20 mEq/L → 腎外性貯留',`尿中Na = ${urine_na} mEq/L`));
        out.push(dxBox('高体液量性低Na血症（腎外性）', '高体液量', [
          ['🫀','心不全','CO低下 → レニン-アンジオテンシン-アルドステロン系＋ADH活性化。浮腫＋肺うっ血。'],
          ['🍶','肝硬変','門脈圧亢進 → 腹水・低アルブミン。スプランクニック血管拡張 → 有効循環血液量低下。'],
          ['🧬','ネフローゼ症候群','低アルブミン → 膠質浸透圧低下 → 浮腫 → 有効循環血液量低下。'],
        ]));
      } else {
        out.push(step('green','STEP 4','尿中Na ≥ 20 mEq/L → 腎性',`尿中Na = ${urine_na} mEq/L`));
        out.push(dxBox('高体液量性低Na血症（腎性）', '腎不全', [
          ['🫘','急性・慢性腎不全','水排泄障害による体液過剰。血清Cr・BUNの上昇を確認。'],
        ]));
      }
    }
  }

  // ─── 補足: 補正速度 + Adrogue-Madias + 治療目標 ───
  let corrNote = '';
  let maxRate24h = 8;

  if (symptoms === 'severe') {
    corrNote = `<div class="warning-box">
      🚨 <strong>重症症状あり — 即時介入適応</strong><br>
      3% 食塩水 <strong>150 mL を 20分かけて静注</strong>（bolus）。症状改善まで繰り返し可（最大3回）。<br>
      目標: <strong>5 mEq/L 上昇</strong>で症状改善を確認 → 以後は通常速度へ移行。<br>
      ${onset !== 'acute' ? '⚠️ 慢性または不明の場合、症状改善後は補正速度を厳格に制限（ODSリスク）。' : ''}
    </div>`;
    maxRate24h = onset === 'acute' ? 12 : 8;
  } else if (onset === 'acute') {
    corrNote = `<div class="info-box">
      🕐 <strong>急性低Na血症（&lt; 48時間）</strong><br>
      脳浮腫リスクが高いため比較的積極的な補正が許容される。<br>
      目標補正速度: <strong>1〜2 mEq/L/h</strong>、正常化まで補正可。ODSリスクは低い。
    </div>`;
    maxRate24h = 12;
  } else if (onset === 'chronic' || onset === 'unknown' || onset === '') {
    if (na < 120) {
      corrNote = `<div class="warning-box">
        ⚠️ <strong>ODS（浸透圧性脱髄症候群）に注意</strong><br>
        慢性または不明の低Na血症は急速補正で ODS を来す恐れがある。<br>
        補正速度の上限: <strong>8 mEq/L/日（最初の24時間）、最大 10〜12 mEq/L/日</strong><br>
        低K血症・栄養不良・アルコール依存・肝疾患がある場合はさらに厳格に（<strong>6 mEq/L/日以内</strong>）。
      </div>`;
      maxRate24h = 8;
    } else if (na < 130) {
      corrNote = `<div class="info-box">
        補正速度は <strong>6〜8 mEq/L/日</strong> を超えないよう管理。慢性の場合は ODSリスクに注意。
      </div>`;
      maxRate24h = 8;
    }
  }

  // Adrogue-Madias 予測 + 治療目標
  const tbw = calcTBW();
  let treatCalcHtml = '';
  if (tbw !== null) {
    const delta3  = (513 - na) / (tbw + 1);   // 3%食塩水 1L投与でのΔNa
    const delta09 = (154 - na) / (tbw + 1);   // 生理食塩水 1L投与でのΔNa
    const targetRate = Math.max(1, maxRate24h * 0.75); // 目標速度 ≦ 最大速度の75%
    const rate3_target = targetRate / 24 / delta3 * 1000;   // mL/h
    const rate3_max    = maxRate24h  / 24 / delta3 * 1000;  // mL/h
    const naGoal = Math.min(135, na + maxRate24h);
    const sexLabel = document.getElementById('sex').value === 'male' ? '男性' : document.getElementById('sex').value === 'female' ? '女性' : '高齢者・るいそう';
    const weightVal = document.getElementById('weight').value;
    treatCalcHtml = `<div class="treat-calc">
      <strong>Adrogue-Madias 予測式</strong><br>
      体重 ${weightVal} kg（${sexLabel}） → TBW = <strong>${tbw.toFixed(1)} L</strong><br>
      <br>
      <strong>3% 食塩水（513 mEq/L）</strong>: 1 L 投与で Na <strong>${delta3 >= 0 ? '+' : ''}${delta3.toFixed(2)} mEq/L</strong><br>
      &nbsp;&nbsp;・目標速度（${targetRate.toFixed(1)} mEq/L/24h）: <strong>${Math.round(rate3_target)} mL/h</strong><br>
      &nbsp;&nbsp;・最大速度（${maxRate24h} mEq/L/24h）: <strong>${Math.round(rate3_max)} mL/h</strong><br>
      <br>
      <strong>生理食塩水（0.9%、154 mEq/L）</strong>: 1 L 投与で Na ${delta09 >= 0 ? '<strong style="color:#276749">+' : '<strong style="color:#9b2c2c">'}${delta09.toFixed(2)} mEq/L</strong>
      ${delta09 < 0 ? '<br>&nbsp;&nbsp;<span style="color:#9b2c2c;font-size:0.8rem;">⚠️ 生食でNaが下がる場合があります（低張尿の影響）</span>' : ''}<br>
      <br>
      <strong>24時間治療目標</strong>: Na <strong>${na}</strong> → <strong>${naGoal} mEq/L</strong>（上昇量 ≤ ${maxRate24h} mEq/L）<br>
      <span style="font-size:0.75rem;color:#718096;">※ Adrogue-Madias式は1回輸液の予測値。持続輸液では排泄の影響で実際の上昇は小さくなるため、定期的なNa測定が必須です。</span>
    </div>`;
  } else {
    treatCalcHtml = `<div class="calc-note" style="margin-top:6px;">💡 <strong>体重・性別</strong>を入力するとAdrogue-Madias式による3%食塩水投与速度が計算されます。</div>`;
  }

  // 水分制限（等体液量性のみ）
  let waterRestriction = '';
  if (volume === 'eu' && urine_osm !== null) {
    const uosmRatio = urine_osm / serum_osm;
    if (uosmRatio > 2) {
      waterRestriction = `<div class="info-box" style="margin-top:8px;">💧 <strong>水分制限（SIADH）</strong><br>尿浸透圧が血清浸透圧の2倍超 → 厳格な水分制限が必要です。<br>目安: <strong>500〜700 mL/日</strong></div>`;
    } else {
      waterRestriction = `<div class="info-box" style="margin-top:8px;">💧 <strong>水分制限（SIADH）</strong><br>目安: <strong>800〜1000 mL/日</strong></div>`;
    }
  }

  out.push(`<div class="step purple"><div class="step-label">治療ガイダンス</div><div class="step-title">補正速度の目安・治療目標</div><div class="step-body">${corrNote}${treatCalcHtml}${waterRestriction}</div></div>`);

  render(out);
}

// ─── 補正Na（高血糖補正）───
function calcCorrectedNa() {
  const na = parseFloat(document.getElementById('serum_na').value);
  const glucose = parseFloat(document.getElementById('glucose').value);
  const display = document.getElementById('corrna_display');
  const result = document.getElementById('corrna_result');

  if (!isNaN(na) && !isNaN(glucose) && glucose > 100) {
    const factor = glucose > 400 ? 2.4 : 1.6;
    const corrNa = (na + factor * (glucose - 100) / 100).toFixed(1);
    const color = parseFloat(corrNa) >= 135 ? '#276749' : '#2b6cb0';
    result.innerHTML = `<strong style="color:${color}">${corrNa} mEq/L</strong>
      <span style="color:#718096;font-size:0.8rem;"> — Na + ${factor}×(血糖−100)/100${glucose > 400 ? '（血糖 > 400 のため係数 2.4 を使用）' : ''}</span>`;
    display.style.display = 'flex';
    display.style.flexDirection = 'column';
    display.style.gap = '5px';
  } else {
    display.style.display = 'none';
  }
}

// ─── TBW計算 ───
function calcTBW() {
  const weight = parseFloat(document.getElementById('weight').value);
  const sex = document.getElementById('sex').value;
  if (isNaN(weight) || weight <= 0 || sex === '') return null;
  const factor = sex === 'male' ? 0.6 : sex === 'female' ? 0.5 : 0.45;
  return weight * factor;
}

// ─── 経時的追跡 ───
let trackRowCount = 1;

function addTrackingRow() {
  trackRowCount++;
  const container = document.getElementById('tracking-rows');
  const row = document.createElement('div');
  row.className = 'tracking-row';
  row.dataset.idx = trackRowCount;
  row.innerHTML = `
    <span style="font-size:0.8rem;color:#4a5568;font-weight:600;min-width:80px;">追加測定</span>
    <div style="display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;">
      <input type="number" class="track-time" placeholder="経過h" step="0.5" min="0"
        oninput="updateTracking()"
        style="border:1.5px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:0.88rem;width:90px;outline:none;">
      <span style="font-size:0.8rem;color:#a0aec0;">h後</span>
      <input type="number" class="track-na" placeholder="Na (mEq/L)" step="1" min="100" max="145"
        oninput="updateTracking()"
        style="border:1.5px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:0.88rem;width:140px;outline:none;">
      <span style="font-size:0.8rem;color:#a0aec0;">mEq/L</span>
    </div>
    <button onclick="this.parentElement.remove(); updateTracking();"
      style="border:none;background:none;color:#a0aec0;cursor:pointer;font-size:1.1rem;padding:4px 8px;">✕</button>
  `;
  container.appendChild(row);
}

function updateTracking() {
  const rows = document.querySelectorAll('#tracking-rows .tracking-row');
  const points = [];

  const firstNaEl = rows[0] ? rows[0].querySelector('.track-na') : null;
  const firstNa = firstNaEl ? parseFloat(firstNaEl.value) : NaN;
  if (!isNaN(firstNa)) points.push({ t: 0, na: firstNa });

  for (let i = 1; i < rows.length; i++) {
    const timeEl = rows[i].querySelector('.track-time');
    const naEl = rows[i].querySelector('.track-na');
    const t = timeEl ? parseFloat(timeEl.value) : NaN;
    const na = naEl ? parseFloat(naEl.value) : NaN;
    if (!isNaN(t) && !isNaN(na)) points.push({ t, na });
  }

  const resultEl = document.getElementById('tracking-result');
  if (points.length < 2) { resultEl.innerHTML = ''; return; }

  points.sort((a, b) => a.t - b.t);
  const baseNa = points[0].na;

  let html = '<div class="tracking-table-wrap"><table class="tracking-table"><thead><tr><th>経過時間</th><th>血清Na</th><th>前回比</th><th>速度 (mEq/L/h)</th><th>24h換算</th><th>判定</th></tr></thead><tbody>';

  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const cumDelta = p.na - baseNa;
    const cumSign = cumDelta >= 0 ? '+' : '';

    if (i === 0) {
      html += `<tr><td>${p.t}h（開始）</td><td><strong>${p.na}</strong> mEq/L</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`;
      continue;
    }
    const prev = points[i - 1];
    const dt = p.t - prev.t;
    const dna = p.na - prev.na;
    const rate = dt > 0 ? dna / dt : null;
    const rate24 = rate !== null ? rate * 24 : null;
    let judgement = '—', rateClass = '';
    if (rate24 !== null) {
      if (rate24 > 12)      { judgement = '🚨 過剰補正'; rateClass = 'rate-danger'; }
      else if (rate24 > 8) { judgement = '⚠️ 要注意';   rateClass = 'rate-warn'; }
      else if (rate24 >= 0){ judgement = '✅ 適切';      rateClass = 'rate-ok'; }
      else                 { judgement = '↓ 低下';       rateClass = ''; }
    }
    html += `<tr>
      <td>${p.t}h</td>
      <td><strong>${p.na}</strong> mEq/L<br><span style="font-size:0.75rem;color:#718096;">累積: ${cumSign}${cumDelta.toFixed(1)}</span></td>
      <td>${dna >= 0 ? '+' : ''}${dna.toFixed(1)} mEq/L</td>
      <td class="${rateClass}">${rate !== null ? (rate >= 0 ? '+' : '') + rate.toFixed(2) : '—'}</td>
      <td class="${rateClass}">${rate24 !== null ? (rate24 >= 0 ? '+' : '') + rate24.toFixed(1) : '—'}</td>
      <td class="${rateClass}"><strong>${judgement}</strong></td>
    </tr>`;
  }
  html += '</tbody></table></div>';

  const last = points[points.length - 1];
  const totalDelta = last.na - baseNa;
  const totalTime = last.t - points[0].t;
  const overallRate24 = totalTime > 0 ? totalDelta / totalTime * 24 : null;

  if (overallRate24 !== null && overallRate24 > 12) {
    html += `<div class="warning-box" style="margin-top:8px;">🚨 <strong>補正速度が過剰です（${overallRate24.toFixed(1)} mEq/L/24h換算）</strong><br>ODSリスクがあります。補正を緩徐にし、必要に応じてD5Wで再下降を検討してください。</div>`;
  } else if (overallRate24 !== null && overallRate24 > 8) {
    html += `<div class="calc-note" style="margin-top:8px;">⚠️ <strong>補正速度がやや速めです（${overallRate24.toFixed(1)} mEq/L/24h換算）</strong><br>慢性の場合、目標上限（8 mEq/L/24h）を超えています。注意が必要です。</div>`;
  } else if (overallRate24 !== null && totalDelta > 0) {
    html += `<div class="info-box" style="margin-top:8px;">✅ 補正速度は適切です（${overallRate24.toFixed(1)} mEq/L/24h換算）。引き続きモニタリングを継続してください。</div>`;
  }

  resultEl.innerHTML = html;
}

function render(out) {
  const el = document.getElementById('result');
  el.innerHTML = out.join('');
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
